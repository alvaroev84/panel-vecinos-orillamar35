<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orillamar 35 · Zona de propietarios</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #535b66; --line: #dde1e6; --brand: #1f4e79; --brand-ink: #ffffff; --err: #b00020; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151a; --card: #1b2028; --ink: #eef1f5; --muted: #aab2bd; --line: #2c333d; --brand: #8db8e8; --brand-ink: #0f1a26; --err: #ff8a9a; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
  header { background: var(--brand); color: var(--brand-ink); padding: 22px 16px 18px; }
  header .wrap { padding-bottom: 0; }
  h1 { margin: 0; font-size: 1.55rem; line-height: 1.2; }
  .sub { margin: 8px 0 0; opacity: .9; font-size: .95rem; }
  h2 { font-size: 1.15rem; margin: 28px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }
  label { display: block; font-weight: 650; margin: 12px 0 6px; }
  select, input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  button { margin-top: 16px; width: 100%; font: inherit; font-weight: 700; padding: 12px; border: 0; border-radius: 10px; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
  button.sec { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  .err { color: var(--err); font-weight: 650; min-height: 1.4em; margin: 10px 0 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  td, th { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tr.tot td { font-weight: 700; }
  a { color: var(--brand); }
  #contenido p { margin: 6px 0; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Zona de propietarios</h1>
  <p class="sub">Comunidad de Propietarios Orillamar 35 · solo con la clave de tu piso</p>
</div></header>
<main class="wrap">
  <div id="acceso" class="card">
    <p>Escanea el QR de la pegatina de tu piso y se abre sola. También puedes escribir la clave que viene en la pegatina.</p>
    <label for="piso">Tu piso</label>
    <select id="piso"></select>
    <label for="clave">Clave</label>
    <input id="clave" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="p. ej. faro-ola-27">
    <button id="entrar" type="button">Entrar</button>
    <p id="err" class="err" role="alert"></p>
    <p class="muted">¿Has perdido la pegatina? Pídesela al presidente (Álvaro, 1º Centro). <a href="./">Volver al panel</a>.</p>
  </div>
  <div id="contenido" hidden></div>
  <button id="salir" class="sec" type="button" hidden>Salir de la zona de propietarios en este móvil</button>
</main>

  var $ = function (id) { return document.getElementById(id); };
  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var GUARDA = 'orillamar35-zona';

  Object.keys(D.pisos).forEach(function (p) {
    var o = document.createElement('option'); o.value = p; o.textContent = D.pisos[p].nombre; $('piso').appendChild(o);
  });

  function abrir(maestra) {
    return crypto.subtle.importKey('raw', maestra, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(D.iv) }, k, b(D.ct)); })
      .then(function (txt) {
        $('contenido').innerHTML = new TextDecoder().decode(txt);
        $('contenido').hidden = false; $('salir').hidden = false; $('acceso').hidden = true;
      });
  }

  function entrar(piso, clave) {
    var info = D.pisos[piso];
    if (!info) return Promise.reject();
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(clave.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(info.sal), iterations: D.iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(info.iv), additionalData: enc.encode(piso) }, k, b(info.k)); })
      .then(function (maestra) {
        try { localStorage.setItem(GUARDA, JSON.stringify({ p: piso, c: clave.trim().toLowerCase() })); } catch (e) {}
        return abrir(maestra);
      });
  }

  function intentar(piso, clave) {
    $('err').textContent = 'Comprobando…';
    entrar(piso, clave).then(function () { $('err').textContent = ''; },
      function () { $('err').textContent = 'La clave no es correcta para ese piso. Revisa la pegatina.'; });
  }

  $('entrar').addEventListener('click', function () { intentar($('piso').value, $('clave').value); });
  $('clave').addEventListener('keydown', function (e) { if (e.key === 'Enter') intentar($('piso').value, $('clave').value); });
  $('salir').addEventListener('click', function () {
    try { localStorage.removeItem(GUARDA); } catch (e) {}
    location.replace(location.pathname);
  });

  window.addEventListener('hashchange', function () { location.reload(); });  // QR escaneado con la página ya abierta
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get('p') && h.get('k')) {
    $('piso').value = h.get('p');
    history.replaceState(null, '', location.pathname);  // quita la clave de la barra de direcciones
    intentar(h.get('p'), h.get('k'));
  } else {
    try {
      var g = JSON.parse(localStorage.getItem(GUARDA) || 'null');
      if (g) { $('piso').value = g.p; entrar(g.p, g.c).catch(function () { try { localStorage.removeItem(GUARDA); } catch (e) {} }); }
    } catch (e) {}
  }
})();
